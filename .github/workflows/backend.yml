name: Deploy two-minute price backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the current deployment account and API token
        env:
          QUOTE_DEPLOY_TOKEN_INPUT: ${{ secrets.GONZO_CLOUDFLARE_TOKEN }}
          QUOTE_ACCOUNT_ID_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, re
          raw_token = os.environ["QUOTE_DEPLOY_TOKEN_INPUT"]
          raw_account = os.environ["QUOTE_ACCOUNT_ID_INPUT"]
          print("Credential source: repository secrets.GONZO_CLOUDFLARE_TOKEN")
          print("Token and Account ID inputs identical: " + str(raw_token.strip() == raw_account.strip()))
          print("Raw token has expected modern prefix: " + str(raw_token.strip().startswith(("cfat_", "cfut_"))))
          print("Raw Account ID has token prefix: " + str(raw_account.strip().startswith(("cfat_", "cfut_"))))
          token = raw_token.strip()
          # Accept common copied wrappers while keeping the credential out of logs.
          header = re.findall(r"Authorization:\s*Bearer\s+([^\s\"']+)", token, re.I)
          if len(header) == 1:
              token = header[0]
          elif token.startswith("CLOUDFLARE_API_TOKEN="):
              token = token.split("=", 1)[1].strip()
          token = token.strip("\"'")
          if token.lower().startswith("bearer "):
              token = token[7:].strip().strip("\"'")
          print("::add-mask::" + token)
          if re.fullmatch(r"[0-9a-fA-F]{32}", token):
              raise SystemExit("The saved API token value is a 32-character ID, not a token secret.")
          if token.startswith("cfat_"):
              print("Account API token format detected")
          elif token.startswith("cfut_"):
              print("User API token format detected")
          else:
              print("Saved token has no modern API token prefix")
          if re.search(r"\s", token) or len(token) < 30:
              raise SystemExit("Saved value is not a complete API token. Copy the token secret displayed immediately after Create Token.")
          if not token:
              raise SystemExit("Missing Cloudflare API token")
          print("::add-mask::" + token)
          saved = raw_account.strip()
          if re.fullmatch(r"[0-9a-fA-F]{32}", saved):
              print("::add-mask::" + saved)
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write("CLOUDFLARE_ACCOUNT_ID=" + saved + "\n")
                  output.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
              print("Saved deployment account configured successfully")
              raise SystemExit(0)
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/accounts?per_page=50", headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Cloudflare account discovery rejected the token: HTTP " + str(error.code))
          accounts = data.get("result", [])
          if not data.get("success") or len(accounts) != 1 or data.get("result_info", {}).get("total_count", 1) != 1:
              raise SystemExit("Automatic discovery requires exactly one accessible Cloudflare account")
          account_id = accounts[0].get("id", "")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", account_id):
              raise SystemExit("Cloudflare returned an invalid account identifier")
          print("::add-mask::" + account_id)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("CLOUDFLARE_ACCOUNT_ID=" + account_id + "\n")
              output.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
          print("Deployment account identified successfully")
          PY
      - name: Register the price feed address if needed
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          url = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/workers/subdomain"
          headers = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"}
          def request(method, body=None):
              req = urllib.request.Request(url, headers=headers, method=method, data=json.dumps(body).encode() if body else None)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      return json.load(error)
                  except ValueError:
                      raise SystemExit("Cloudflare address setup failed: HTTP " + str(error.code))
          data = request("GET")
          if data.get("success") and data.get("result", {}).get("subdomain"):
              print("Existing Workers address preserved")
          else:
              codes = {error.get("code") for error in data.get("errors", [])}
              if codes - {10007}:
                  raise SystemExit("Cloudflare address lookup failed; codes: " + str(sorted(codes)))
              data = request("PUT", {"subdomain": "gonzo0906-portfolio"})
              if not data.get("success"):
                  raise SystemExit("Cloudflare address registration failed; codes: " + str([error.get("code") for error in data.get("errors", [])]))
              print("Workers address registered successfully")
          PY
      - name: Deploy quote backend with current saved credentials
        run: npx --yes wrangler@4 deploy --config backend/wrangler.jsonc
