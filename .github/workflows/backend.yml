name: Deploy two-minute price backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify deployment account securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SAVED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, re
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          # Accept common copied wrappers while keeping the credential out of logs.
          header = re.findall(r"Authorization:\s*Bearer\s+([^\s\"']+)", token, re.I)
          if len(header) == 1:
              token = header[0]
          elif token.startswith("CLOUDFLARE_API_TOKEN="):
              token = token.split("=", 1)[1].strip()
          token = token.strip("\"'")
          if token.lower().startswith("bearer "):
              token = token[7:].strip().strip("\"'")
          print("::add-mask::" + token)
          if re.search(r"\s", token) or len(token) < 30:
              raise SystemExit("Saved value is not a complete API token. Copy the token secret displayed immediately after Create Token.")
          if not token:
              raise SystemExit("Missing Cloudflare API token")
          print("::add-mask::" + token)
          saved = os.environ.get("SAVED_CLOUDFLARE_ACCOUNT_ID", "").strip()
          if re.fullmatch(r"[0-9a-fA-F]{32}", saved):
              print("::add-mask::" + saved)
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write("CLOUDFLARE_ACCOUNT_ID=" + saved + "\n")
                  output.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
              print("Saved deployment account configured successfully")
              raise SystemExit(0)
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/accounts?per_page=50", headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Cloudflare account discovery rejected the token: HTTP " + str(error.code))
          accounts = data.get("result", [])
          if not data.get("success") or len(accounts) != 1 or data.get("result_info", {}).get("total_count", 1) != 1:
              raise SystemExit("Automatic discovery requires exactly one accessible Cloudflare account")
          account_id = accounts[0].get("id", "")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", account_id):
              raise SystemExit("Cloudflare returned an invalid account identifier")
          print("::add-mask::" + account_id)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("CLOUDFLARE_ACCOUNT_ID=" + account_id + "\n")
              output.write("CLOUDFLARE_API_TOKEN=" + token + "\n")
          print("Deployment account identified successfully")
          PY
      - name: Deploy secure quote backend
        run: npx --yes wrangler@4 deploy --config backend/wrangler.jsonc
