name: Refresh market data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gonzo-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify valuation and alert logic
        run: npm test
      - name: Run calculation and provider parsing checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public market feeds
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python3 scripts/refresh.py
      - name: Install UI verification dependencies
        if: github.event_name != 'schedule'
        run: npm ci && npx playwright install --with-deps chromium
      - name: Verify viewport layout, pagination, persistence and popup behavior
        if: github.event_name != 'schedule'
        run: npx playwright test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
